<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="conoce como inscribirte al parche dev">
    <title>Inscripciones</title>
</head>
<body>
    <a href="#contenido">saltar al contenido</a>
    <header>
        <h1><a href="index.html">Parche dev</a></h1>
        <nav aria-label="Menu principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="ponentes.html">Ponentes</a></li>
               <li><a href="inscripcion.html" aria-current="page">Inscripción</a></li>
                <li><a href="conducta.html">Codigo de conducta</a></li>
            </ul>
         </nav>
   </header>
   <main id="contenido">
    <h2>Inscríbete a Parche Dev</h2>
    <p>Reserva tu cupo para nuestro encuentro de desarrolladores.</p>

    <form action="gracias.html" method="get">
        <p>
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required>
        </p>

        <p>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required>
        </p>

        <p>
            <label for="perfil">¿Cuál es tu perfil?</label>
            <select id="perfil" name="perfil" required>
                <option value="">Selecciona una opción</option>
                <option value="estudiante">Estudiante</option>
                <option value="desarrollador">Desarrollador/a</option>
                <option value="otro">Otro</option>
            </select>
        </p>

        <p>
            <input type="checkbox" id="acepto" name="acepto" required>
            <label for="acepto">Acepto el código de conducta.</label>
        </p>

        <button type="submit">Reservar mi cupo</button>
    </form>
</main>
</body>
</html>
